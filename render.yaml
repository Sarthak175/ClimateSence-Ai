# Render Blueprint - New > Blueprint > select this repository
services:
  - type: web
    name: climatesense-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app      # <- change to your Vercel URL
      - key: DEVICE_TOKEN
        generateValue: true                      # Render creates a random secret; copy it to the ESP32
